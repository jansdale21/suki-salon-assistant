# WS-D item 3 evidence: scans the WHOLE git history for keys/passwords on every push.
name: secret-scan
on: [push, pull_request, workflow_dispatch]
permissions: { contents: read }
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: gitleaks (full history)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest \
            git /repo --redact --verbose --report-path /repo/gitleaks-report.json
