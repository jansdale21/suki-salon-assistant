<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 760" font-family="Segoe UI,system-ui,-apple-system,Roboto,sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Suki AWS infrastructure</title>
  <desc id="d">A customer looks up suki-salon.duckdns.org, then sends the question over HTTPS to nginx on one EC2 instance. nginx passes it to LibreChat, which saves the chat in MongoDB and sends it to the Suki gateway; the gateway adds salon knowledge from S3 and calls Google Gemini outside AWS. Secrets come from Parameter Store, logs and metrics go to CloudWatch, and alarms e-mail the team through SNS.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6B2D5C"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8a8a8a"/></marker>
    <style>
      .box{fill:#fff;stroke:#6B2D5C;stroke-width:1.5}
      .svc{fill:#FFF4F0;stroke:#E07A9B;stroke-width:1.5}
      .ext{fill:#f5f5f5;stroke:#8a8a8a;stroke-width:1.5;stroke-dasharray:6 4}
      .h{font-size:15px;font-weight:700;fill:#3b1834}
      .s{font-size:12px;fill:#4a4048}
      .t{font-size:13px;fill:#4a4048}
      .n{font-size:12px;font-weight:700;fill:#fff}
      .flow{stroke:#6B2D5C;stroke-width:2.4;fill:none;marker-end:url(#a)}
      .ops{stroke:#8a8a8a;stroke-width:1.5;fill:none;stroke-dasharray:5 4;marker-end:url(#g)}
      .dot{fill:#6B2D5C}
    </style>
  </defs>
  <rect width="1240" height="760" fill="#fffaf8"/>

  <!-- outside AWS, left -->
  <rect class="ext" x="30" y="30" width="170" height="70" rx="10"/>
  <text class="h" x="115" y="60" text-anchor="middle">DuckDNS</text>
  <text class="s" x="115" y="80" text-anchor="middle">suki-salon.duckdns.org</text>
  <rect class="box" x="30" y="150" width="170" height="70" rx="10"/>
  <text class="h" x="115" y="180" text-anchor="middle">Customer</text>
  <text class="s" x="115" y="200" text-anchor="middle">web browser</text>
  <path class="ops" d="M115 150V104"/>
  <circle class="dot" cx="115" cy="127" r="11"/><text class="n" x="115" y="131" text-anchor="middle">1</text>
  <text class="s" x="132" y="131">DNS lookup</text>

  <!-- AWS account -->
  <rect x="230" y="20" width="780" height="720" rx="18" fill="none" stroke="#3b1834" stroke-width="1.6"/>
  <text class="h" x="252" y="50">AWS account · one region: ap-southeast-1 (Singapore)</text>

  <!-- EC2 -->
  <rect class="box" x="255" y="66" width="730" height="334" rx="14"/>
  <text class="h" x="277" y="94">EC2 t3.small · Amazon Linux 2023 · Docker</text>
  <text class="s" x="277" y="114">HTTPS 443 with Let&apos;s Encrypt · port 80 only redirects · no SSH · IMDSv2 · encrypted disk</text>

  <rect class="svc" x="280" y="150" width="190" height="70" rx="10"/>
  <text class="h" x="375" y="180" text-anchor="middle">nginx</text>
  <text class="s" x="375" y="200" text-anchor="middle">HTTPS · Suki branding · logs</text>

  <rect class="svc" x="520" y="150" width="200" height="70" rx="10"/>
  <text class="h" x="620" y="180" text-anchor="middle">LibreChat (reskinned)</text>
  <text class="s" x="620" y="200" text-anchor="middle">web app · login · chat</text>

  <rect class="svc" x="770" y="150" width="190" height="70" rx="10"/>
  <text class="h" x="865" y="180" text-anchor="middle">Suki gateway</text>
  <text class="s" x="865" y="200" text-anchor="middle">salon facts · hides phone/e-mail</text>

  <rect class="svc" x="520" y="262" width="200" height="56" rx="10"/>
  <text class="h" x="620" y="287" text-anchor="middle">MongoDB</text>
  <text class="s" x="620" y="305" text-anchor="middle">users and conversations</text>

  <rect class="svc" x="280" y="334" width="680" height="54" rx="10"/>
  <text class="h" x="620" y="356" text-anchor="middle">CloudWatch agent · systemd timers</text>
  <text class="s" x="620" y="376" text-anchor="middle">memory/disk metrics · backup every 6 h · tests at 03:00 and 15:00 · certificate check daily</text>

  <!-- question flow -->
  <path class="flow" d="M200 185H276"/>
  <circle class="dot" cx="214" cy="185" r="11"/><text class="n" x="214" y="189" text-anchor="middle">2</text>
  <path class="flow" d="M470 185H516"/>
  <circle class="dot" cx="492" cy="185" r="11"/><text class="n" x="492" y="189" text-anchor="middle">3</text>
  <path class="flow" d="M720 185H766"/>
  <circle class="dot" cx="742" cy="185" r="11"/><text class="n" x="742" y="189" text-anchor="middle">4</text>
  <path class="flow" d="M620 220V258"/>
  <text class="s" x="630" y="244">saves chat</text>
  <path class="flow" d="M960 185H1046"/>
  <circle class="dot" cx="1030" cy="185" r="11"/><text class="n" x="1030" y="189" text-anchor="middle">5</text>

  <!-- Gemini -->
  <rect class="ext" x="1050" y="150" width="170" height="70" rx="10"/>
  <text class="h" x="1135" y="180" text-anchor="middle">Google Gemini</text>
  <text class="s" x="1135" y="200" text-anchor="middle">free tier · outside AWS</text>

  <!-- services row 1 -->
  <path class="ops" d="M335 400V436"/><path class="ops" d="M525 400V436"/><path class="ops" d="M715 400V436"/>
  <rect class="svc" x="255" y="440" width="160" height="66" rx="10"/>
  <text class="h" x="335" y="468" text-anchor="middle">Parameter Store</text>
  <text class="s" x="335" y="488" text-anchor="middle">secrets (SecureString)</text>
  <rect class="svc" x="445" y="440" width="160" height="66" rx="10"/>
  <text class="h" x="525" y="468" text-anchor="middle">S3 (versioned)</text>
  <text class="s" x="525" y="488" text-anchor="middle">knowledge · backups · tests</text>
  <rect class="svc" x="635" y="440" width="160" height="66" rx="10"/>
  <text class="h" x="715" y="468" text-anchor="middle">CloudWatch</text>
  <text class="s" x="715" y="488" text-anchor="middle">logs · alarms · dashboard</text>
  <rect class="svc" x="825" y="440" width="160" height="66" rx="10"/>
  <text class="h" x="905" y="468" text-anchor="middle">SNS</text>
  <text class="s" x="905" y="488" text-anchor="middle">e-mail alerts</text>
  <path class="ops" d="M795 473H821"/>

  <!-- services row 2 -->
  <rect class="svc" x="255" y="540" width="160" height="66" rx="10"/>
  <text class="h" x="335" y="568" text-anchor="middle">Lambda</text>
  <text class="s" x="335" y="588" text-anchor="middle">health check every 5 min</text>
  <rect class="svc" x="445" y="540" width="160" height="66" rx="10"/>
  <text class="h" x="525" y="568" text-anchor="middle">CloudTrail</text>
  <text class="s" x="525" y="588" text-anchor="middle">audit: who did what</text>
  <rect class="svc" x="635" y="540" width="160" height="66" rx="10"/>
  <text class="h" x="715" y="568" text-anchor="middle">GuardDuty</text>
  <text class="s" x="715" y="588" text-anchor="middle">pending AWS verification</text>
  <rect class="svc" x="825" y="540" width="160" height="66" rx="10"/>
  <text class="h" x="905" y="568" text-anchor="middle">AWS Budgets</text>
  <text class="s" x="905" y="588" text-anchor="middle">cost alert e-mail</text>

  <!-- IAM -->
  <rect class="svc" x="255" y="640" width="730" height="70" rx="10"/>
  <text class="h" x="620" y="668" text-anchor="middle">IAM: one user per student with MFA · admin role needs MFA · EC2 instance role · GitHub OIDC role</text>
  <text class="s" x="620" y="690" text-anchor="middle">least privilege · no long-lived keys on the server or in GitHub</text>

  <!-- team inbox -->
  <rect class="ext" x="1050" y="440" width="170" height="66" rx="10"/>
  <text class="h" x="1135" y="468" text-anchor="middle">Team inbox</text>
  <text class="s" x="1135" y="488" text-anchor="middle">alarms and budget</text>
  <path class="ops" d="M985 473H1046"/>
  <path class="ops" d="M985 573H1135V510"/>

  <!-- legend -->
  <text class="h" x="1040" y="630">A question, step by step</text>
  <text class="t" x="1040" y="652">1 browser looks up the name</text>
  <text class="t" x="1040" y="670">2 HTTPS to nginx on EC2</text>
  <text class="t" x="1040" y="688">3 nginx → LibreChat</text>
  <text class="t" x="1040" y="706">4 LibreChat → Suki gateway</text>
  <text class="t" x="1040" y="724">5 gateway → Gemini, and back</text>
  <text class="s" x="1040" y="746">solid = question · dashed = ops</text>
</svg>
