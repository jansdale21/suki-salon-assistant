# Laptop/Codespaces version of nginx.conf: plain HTTP on port 80 (mapped to 8088), no certificate.
# Jobs: serve Suki branding over LibreChat's own assets, write one JSON access-log line per
# request (CloudWatch metric filters count requests, 5xx and response time), add security headers.
worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  server_tokens off;
  sendfile on;
  client_max_body_size 5m;

  # Streaming chat endpoints are excluded from the response-time metric (they stay open while
  # the model writes the answer). The gateway measures model latency separately.
  map $uri $is_stream {
    ~^/api/(agents/chat|ask|edit|messages/stream)  1;
    default 0;
  }
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  # No client IP in the log on purpose: we do not need it, so we do not keep it.
  log_format suki_json escape=json
    '{"ts":"$time_iso8601","method":"$request_method","uri":"$uri","status":$status,'
    '"request_time":$request_time,"upstream_time":"$upstream_response_time",'
    '"bytes":$body_bytes_sent,"stream":$is_stream}';
  access_log /dev/stdout suki_json;
  error_log  /dev/stderr warn;

  upstream librechat { server api:3080; keepalive 16; }

  server {
    listen 80 default_server;
    server_name _;
    include /etc/nginx/suki-app.conf;
  }
}
