# Shared by the HTTPS server and the local-only HTTP server in nginx.conf.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Strict-Transport-Security "max-age=31536000" always;

location = /nginx-health { access_log off; return 200 "ok\n"; }

# --- Suki branding replaces LibreChat's bundled assets (identity) ---
location = /assets/logo.svg                 { alias /branding/logo.svg; }        # full logo (sign-in page)
location = /assets/suki-icon.svg            { alias /branding/suki-icon.svg; }   # round icon (chat avatar)
location = /branding/suki.css               { alias /branding/suki.css; }
location = /assets/favicon-16x16.png        { alias /branding/favicon-16x16.png; }
location = /assets/favicon-32x32.png        { alias /branding/favicon-32x32.png; }
location = /assets/apple-touch-icon-180x180.png { alias /branding/apple-touch-icon-180x180.png; }
location = /assets/icon-192x192.png         { alias /branding/icon-192x192.png; }
location = /assets/maskable-icon.png        { alias /branding/maskable-icon.png; }

location / {
  proxy_pass http://librechat;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_buffering off;              # stream answers to the browser as they arrive
  # Inject Suki's stylesheet into LibreChat's HTML pages (bigger sign-in logo).
  proxy_set_header Accept-Encoding "";   # sub_filter needs uncompressed HTML from LibreChat
  sub_filter_once on;
  sub_filter '</head>' '<link rel="stylesheet" href="/branding/suki.css?v=1"></head>';
  proxy_read_timeout 300s;
}
