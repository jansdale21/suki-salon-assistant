# nginx in front of LibreChat. CloudFront (HTTPS) -> this server (port 80) -> LibreChat (3080).
# Jobs: serve Suki branding over LibreChat's own assets, write one JSON access-log line per
# request (CloudWatch metric filters count requests, 5xx and response time), add security headers.
worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  server_tokens off;
  sendfile on;
  client_max_body_size 5m;

  # Streaming chat endpoints are excluded from the response-time metric (they stay open while
  # the model writes the answer). The gateway measures model latency separately.
  map $uri $is_stream {
    ~^/api/(agents/chat|ask|edit|messages/stream)  1;
    default 0;
  }
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  map $http_cloudfront_forwarded_proto $fwd_proto { default $http_cloudfront_forwarded_proto; '' $scheme; }

  # No client IP in the log on purpose: we do not need it, so we do not keep it.
  log_format suki_json escape=json
    '{"ts":"$time_iso8601","method":"$request_method","uri":"$uri","status":$status,'
    '"request_time":$request_time,"upstream_time":"$upstream_response_time",'
    '"bytes":$body_bytes_sent,"stream":$is_stream}';
  access_log /dev/stdout suki_json;
  error_log  /dev/stderr warn;

  upstream librechat { server api:3080; keepalive 16; }

  server {
    listen 80 default_server;
    server_name _;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location = /nginx-health { access_log off; return 200 "ok\n"; }

    # --- Suki branding replaces LibreChat's bundled assets (identity) ---
    location = /assets/logo.svg                 { alias /branding/logo.svg; }
    location = /assets/favicon-16x16.png        { alias /branding/favicon-16x16.png; }
    location = /assets/favicon-32x32.png        { alias /branding/favicon-32x32.png; }
    location = /assets/apple-touch-icon-180x180.png { alias /branding/apple-touch-icon-180x180.png; }
    location = /assets/icon-192x192.png         { alias /branding/icon-192x192.png; }
    location = /assets/maskable-icon.png        { alias /branding/maskable-icon.png; }

    location / {
      proxy_pass http://librechat;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $fwd_proto;
      proxy_buffering off;              # stream answers to the browser as they arrive
      proxy_read_timeout 300s;
    }
  }
}
