# nginx in front of LibreChat. Browser (HTTPS, Let's Encrypt certificate, port 443) -> nginx -> LibreChat (3080).
# Port 80 only answers Let's Encrypt checks, redirects the public name to HTTPS, and serves the app to
# health checks on the server itself (127.0.0.1 / Docker network); everyone else gets 403.
# Jobs: serve Suki branding over LibreChat's own assets, write one JSON access-log line per
# request (CloudWatch metric filters count requests, 5xx and response time), add security headers.
worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  server_tokens off;
  sendfile on;
  client_max_body_size 5m;

  # Streaming chat endpoints are excluded from the response-time metric (they stay open while
  # the model writes the answer). The gateway measures model latency separately.
  map $uri $is_stream {
    ~^/api/(agents/chat|ask|edit|messages/stream)  1;
    default 0;
  }
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  # No client IP in the log on purpose: we do not need it, so we do not keep it.
  log_format suki_json escape=json
    '{"ts":"$time_iso8601","method":"$request_method","uri":"$uri","status":$status,'
    '"request_time":$request_time,"upstream_time":"$upstream_response_time",'
    '"bytes":$body_bytes_sent,"stream":$is_stream}';
  access_log /dev/stdout suki_json;
  error_log  /dev/stderr warn;

  upstream librechat { server api:3080; keepalive 16; }

  # Port 80, public name (name.duckdns.org or x-x-x-x.sslip.io): Let's Encrypt challenge files, everything else -> HTTPS.
  server {
    listen 80;
    server_name ~\.sslip\.io$ ~\.duckdns\.org$;
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
  }

  # Port 80, anything else: only the server itself (deploy.sh, restore drill) may use plain HTTP.
  server {
    listen 80 default_server;
    server_name _;
    allow 127.0.0.1;
    allow 172.16.0.0/12;
    deny all;
    include /etc/nginx/suki-app.conf;
  }

  # Port 443: the real site.
  server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;
    ssl_certificate     /etc/suki-tls/fullchain.pem;
    ssl_certificate_key /etc/suki-tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:5m;
    ssl_session_timeout 1h;
    include /etc/nginx/suki-app.conf;
  }
}
