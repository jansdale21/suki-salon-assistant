# Laptop version of the stack (week 1: "running locally"). No AWS needed.
#   cp .env.local.example .env.local   # then fill in the values (never commit it)
#   docker compose -f docker-compose.local.yml --env-file .env.local up -d --build
#   open http://localhost:8088
name: suki-local

services:
  nginx:
    image: docker.io/library/nginx:1.27-alpine
    ports: ["8088:80"]
    volumes:
      - ./nginx/nginx.local.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/suki-app.conf:/etc/nginx/suki-app.conf:ro
      - ./branding:/branding:ro
    depends_on: [api]

  api:
    image: ${LIBRECHAT_IMAGE:-registry.librechat.ai/librechat-ai/librechat:v0.8.9}
    env_file: .env.local
    environment:
      - HOST=0.0.0.0
      - PORT=3080
      - MONGO_URI=mongodb://mongodb:27017/LibreChat
      - CONFIG_PATH=/app/librechat.yaml
      - DOMAIN_CLIENT=http://localhost:8088
      - DOMAIN_SERVER=http://localhost:8088
    volumes:
      - ./librechat.yaml:/app/librechat.yaml:ro
    depends_on: [mongodb, gateway]

  mongodb:
    image: docker.io/library/mongo:8.0.20
    volumes: [suki-local-mongo:/data/db]

  gateway:
    build: ./gateway
    env_file: .env.local          # GEMINI_API_KEY and GATEWAY_TOKEN for local testing only
    environment:
      - SUKI_DISABLE_SSM=1
      - KNOWLEDGE_SOURCE=file:///content
      - APP_VERSION=local
    volumes:
      - ../content:/content:ro
    ports: ["127.0.0.1:8080:8080"]

volumes:
  suki-local-mongo:
